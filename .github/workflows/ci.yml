name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

env:
  VCPKG_COMMIT: cd61e1e26a038e82d6550a3ebbe0fbbfe7da78e3

jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        preset: [windows-debug, windows-release]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: ${{ env.VCPKG_COMMIT }}
          path: .vcpkg
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: seanmiddleditch/gha-setup-ninja@master
      - name: Bootstrap vcpkg
        shell: pwsh
        run: .\.vcpkg\bootstrap-vcpkg.bat -disableMetrics
      - name: Configure
        shell: pwsh
        run: |
          $env:VCPKG_ROOT = "$pwd\.vcpkg"
          $env:GTOSD_NINJA_EXE = (Get-Command ninja).Source
          cmake --preset ${{ matrix.preset }}
      - name: Build
        shell: pwsh
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        shell: pwsh
        run: ctest --preset ${{ matrix.preset }}
      - name: CLI smoke
        shell: pwsh
        run: .\out\build\${{ matrix.preset }}\apps\gto_cli\gto_cli.exe self-check
      - name: Install tree
        if: matrix.preset == 'windows-release'
        shell: pwsh
        run: cmake --install out/build/windows-release --prefix out/install/ci
      - name: Benchmark smoke
        if: matrix.preset == 'windows-release'
        shell: pwsh
        run: >-
          .\out\build\windows-release\benchmarks\gtosd_benchmark_smoke.exe
          --benchmark_filter=BM_EvaluateSeven.*
          --benchmark_min_time=0.01s

  format-and-tidy:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: ${{ env.VCPKG_COMMIT }}
          path: .vcpkg
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: seanmiddleditch/gha-setup-ninja@master
      - name: Bootstrap vcpkg
        shell: pwsh
        run: .\.vcpkg\bootstrap-vcpkg.bat -disableMetrics
      - name: Configure with clang-tidy
        shell: pwsh
        run: |
          $env:VCPKG_ROOT = "$pwd\.vcpkg"
          $env:GTOSD_NINJA_EXE = (Get-Command ninja).Source
          cmake --preset windows-debug -DGTOSD_ENABLE_CLANG_TIDY=ON
      - name: Format check
        shell: pwsh
        run: cmake --build out/build/windows-debug --target format-check
      - name: Tidy all first-party production modules
        shell: pwsh
        run: cmake --build out/build/windows-debug --target gto_cli

  windows-asan-clang:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: ${{ env.VCPKG_COMMIT }}
          path: .vcpkg
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: seanmiddleditch/gha-setup-ninja@master
      - name: Bootstrap vcpkg
        shell: pwsh
        run: .\.vcpkg\bootstrap-vcpkg.bat -disableMetrics
      - name: Configure clang-cl ASan
        shell: pwsh
        run: >-
          cmake -S . -B out/asan -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_CXX_COMPILER=clang-cl
          -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/.vcpkg/scripts/buildsystems/vcpkg.cmake"
          -DCMAKE_CXX_FLAGS="/EHsc /fsanitize=address"
          -DGTOSD_BUILD_FRAMEWORK_TESTS=OFF
          -DGTOSD_BUILD_BENCHMARKS=OFF
          -DGTOSD_WARNINGS_AS_ERRORS=ON
      - name: Build
        shell: pwsh
        run: cmake --build out/asan
      - name: Test
        shell: pwsh
        run: ctest --test-dir out/asan --output-on-failure

  ubsan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: ${{ env.VCPKG_COMMIT }}
          path: .vcpkg
      - name: Bootstrap vcpkg
        run: ./.vcpkg/bootstrap-vcpkg.sh -disableMetrics
      - name: Configure
        run: >-
          cmake -S . -B out/ubsan
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/.vcpkg/scripts/buildsystems/vcpkg.cmake"
          -DCMAKE_CXX_FLAGS="-fsanitize=undefined -fno-sanitize-recover=all"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=undefined"
          -DGTOSD_BUILD_FRAMEWORK_TESTS=OFF
          -DGTOSD_BUILD_BENCHMARKS=OFF
          -DGTOSD_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build out/ubsan --parallel 4
      - name: Test
        run: ctest --test-dir out/ubsan --output-on-failure

  phase2-nightly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: ${{ env.VCPKG_COMMIT }}
          path: .vcpkg
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: seanmiddleditch/gha-setup-ninja@master
      - name: Bootstrap vcpkg
        shell: pwsh
        run: .\.vcpkg\bootstrap-vcpkg.bat -disableMetrics
      - name: Configure nightly oracle
        shell: pwsh
        run: |
          $env:VCPKG_ROOT = "$pwd\.vcpkg"
          $env:GTOSD_NINJA_EXE = (Get-Command ninja).Source
          cmake --preset windows-release -DGTOSD_BUILD_NIGHTLY_TESTS=ON
      - name: Build nightly oracle
        shell: pwsh
        run: cmake --build --preset windows-release --target gtosd_phase2_nightly_tests
      - name: Run one million deterministic deals
        shell: pwsh
        run: ctest --preset windows-release -L nightly
